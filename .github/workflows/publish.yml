name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Reviewed pull request number
        required: true
        type: string
      head_sha:
        description: Required reviewed 40-character head SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: bottle-publication-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      attestations: write
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Set up trusted main checkout and Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
      - name: Validate review, retain exact bottles, revalidate and publish
        id: bottles
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # pr-pull replaces tap files; keep the validator from trusted main outside that checkout.
          cp .github/scripts/tap_ci.rb "$RUNNER_TEMP/tap_ci.rb"
          brew ruby "$RUNNER_TEMP/tap_ci.rb" publish "$PULL_REQUEST" "$HEAD_SHA"
      - name: Generate published bottle provenance
        if: success() && steps.bottles.outputs.bottle_path != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.bottles.outputs.bottle_path }}/*.tar.gz"
